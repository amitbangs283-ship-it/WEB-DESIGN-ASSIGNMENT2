<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayNear | Find a Room</title>
    <meta name="description" content="Stay near student accommodation finder" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="brand-wrap-page">
          <div class="brand-row">
            <span class="brand-mark">S</span>
            <span class="brand-name">StayNear</span>
          </div>
          <span class="brand-desc">stay near student accommodation finder</span>
        </div>

        <nav class="nav-buttons" aria-label="Main navigation">
          <a class="nav-btn" href="index.html">01 Home</a>
          <a class="nav-btn" href="about.html">02 About</a>
          <a class="nav-btn" href="services.html">03 Services</a>
          <a class="nav-btn active" href="find-room.html">04 Find a Room</a>
          <a class="nav-btn" href="contact.html">05 Contact</a>
        </nav>
      </header>

      <main class="page-shell-inner">
        <section class="section-card">
          <div class="panel-heading">
            <span class="panel-title">Find a room</span>
            <span class="meatball"></span>
          </div>
          <div class="search-box">
            <div class="search-row">
              <div class="search-item">
                <label>Arrival</label>
                <input type="date" value="2026-11-01" />
              </div>
              <div class="search-item">
                <label>Departure</label>
                <input type="date" value="2026-11-10" />
              </div>
              <div class="search-item">
                <label>Guests</label>
                <select>
                  <option>2 Guests</option>
                  <option>3 Guests</option>
                  <option>4 Guests</option>
                </select>
              </div>
              <button class="search-btn" type="button">Search</button>
            </div>
          </div>
          <div class="image-grid">
            <div class="mini-photo-card">
              <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=800&q=80" alt="Modern student room" />
            </div>
            <div class="mini-photo-card">
              <img src="https://images.unsplash.com/photo-1494526585095-c41746248156?auto=format&fit=crop&w=800&q=80" alt="Shared student apartment" />
            </div>
            <div class="mini-photo-card">
              <img src="https://images.unsplash.com/photo-1484154218962-a197022b5858?auto=format&fit=crop&w=800&q=80" alt="Comfortable accommodation" />
            </div>
          </div>
        </section>

        <section class="section-card">
          <div class="panel-heading">
            <span class="panel-title">Available rooms</span>
            <span class="meatball"></span>
          </div>
          <div class="room-list">
            <div class="room-entry">
              <span>Studio</span>
              <span>Private</span>
              <span>$420</span>
            </div>
            <div class="room-entry">
              <span>Shared</span>
              <span>Double</span>
              <span>$290</span>
            </div>
            <div class="room-entry">
              <span>1 bedroom</span>
              <span>Apartment</span>
              <span>$540</span>
            </div>
            <div class="room-entry">
              <span>Family</span>
              <span>Shared</span>
              <span>$360</span>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="brand-row">
          <span class="brand-mark">S</span>
          <span class="brand-name">StayNear</span>
        </div>
        <div class="footer-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="services.html">Services</a>
          <a href="contact.html">Contact</a>
        </div>
        <small>stay near student accommodation finder</small>
      </footer>
    </div>
  </body>
</html>
