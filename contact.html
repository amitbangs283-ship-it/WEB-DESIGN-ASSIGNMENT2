<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayNear | Contact</title>
    <meta name="description" content="Contact StayNear Student Accommodation Finder" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="brand-wrap-page">
          <div class="brand-row">
            <span class="brand-mark">S</span>
            <span class="brand-name">STAYNEAR</span>
          </div>
          <span class="brand-desc">Student Accommodation Finder</span>
        </div>

        <nav class="nav-buttons" aria-label="Main navigation">
          <a class="nav-btn" href="index.html">01 Home</a>
          <a class="nav-btn" href="about.html">02 About</a>
          <a class="nav-btn" href="services.html">03 Services</a>
          <a class="nav-btn" href="find-room.html">04 Find a Room</a>
          <a class="nav-btn active" href="contact.html">05 Contact</a>
        </nav>
      </header>

      <main class="page-shell-inner">
        <div class="contact-layout-page">
          <section class="section-card">
            <div class="panel-heading">
              <span class="panel-title">Contact</span>
              <span class="meatball"></span>
            </div>
            <div class="details-list">
              <div class="details-item">
                <strong>Email</strong>
                hello@staynearfinder.com
              </div>
              <div class="details-item">
                <strong>Phone</strong>
                +44 20 1234 5678
              </div>
              <div class="details-item">
                <strong>Office</strong>
                45 Campus Lane, London
              </div>
            </div>
            <div class="mini-photo-card" style="margin-top:14px; min-height:180px;">
              <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1000&q=80" alt="Students talking in support office" />
            </div>
          </section>

          <section class="section-card">
            <div class="panel-heading">
              <span class="panel-title">Send a message</span>
              <span class="meatball"></span>
            </div>
            <form class="contact-form-page" action="#">
              <input type="text" placeholder="Your name" />
              <input type="email" placeholder="Email address" />
              <input type="text" placeholder="Subject" />
              <textarea placeholder="Tell us what you need..."></textarea>
              <div class="submit-row">
                <button class="nav-btn" type="submit">Send</button>
              </div>
            </form>
            <div class="mini-photo-card" style="margin-top:14px; min-height:150px;">
              <img src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?auto=format&fit=crop&w=1000&q=80" alt="Student support call center" />
            </div>
          </section>
        </div>
      </main>

      <footer class="site-footer">
        <div class="brand-row">
          <span class="brand-mark">S</span>
          <span class="brand-name">StayNear</span>
        </div>
        <div class="footer-links">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="services.html">Services</a>
          <a href="contact.html">Contact</a>
        </div>
        <small>Student Accommodation Finder</small>
      </footer>
    </div>
  </body>
</html>
